<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dhikr & Dua — Interactive Prototype</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Amiri & Scheherazade New for crisp Arabic, Plus Jakarta Sans & Cormorant Garamond for English -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-arabic: 'Amiri', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: var(--font-sans);
      background: radial-gradient(circle at 50% 20%, #0f2537 0%, #050c12 100%);
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .arabic-text {
      font-family: var(--font-arabic);
      line-height: 1.75;
      text-shadow: 0 4px 24px rgba(255, 255, 255, 0.22);
    }

    .serif-accent {
      font-family: var(--font-serif);
    }

    /* Subtle twinkling stars animation */
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.95; transform: scale(1.15); }
    }

    .star {
      animation: twinkle var(--duration, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    /* Swaying lanterns in the market scene */
    @keyframes sway {
      0%, 100% { transform: rotate(-3.5deg); }
      50% { transform: rotate(3.5deg); }
    }

    .lantern-sway {
      transform-origin: top center;
      animation: sway var(--sway-dur, 4.2s) ease-in-out infinite;
      animation-delay: var(--sway-delay, 0s);
    }

    /* Gentle breathing/bobbing for marketplace figures */
    @keyframes breathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .figure-bob {
      animation: breathe var(--bob-dur, 3.8s) ease-in-out infinite;
      animation-delay: var(--bob-delay, 0s);
    }

    /* Floating +1 animation */
    @keyframes floatUpFade {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.85);
      }
      20% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-34px) scale(1.05);
      }
    }

    .float-plus {
      animation: floatUpFade 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Story step text transition */
    @keyframes storyEnter {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) scale(1);
        filter: blur(0px);
      }
    }

    .story-step-anim {
      animation: storyEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Archway transition when switching from intro to full market scene */
    .market-arch-mask {
      transition: clip-path 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Custom Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-dvh w-screen flex flex-col items-center justify-center sm:p-4 md:p-6 select-none">

  <!-- Ambient Desktop Header / Hint (Hidden on small mobile screens) -->
  <div class="hidden sm:flex items-center justify-between w-full max-w-[410px] mb-2.5 px-2 text-xs text-slate-400/90">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      <span class="font-medium tracking-wide text-slate-300">Dhikr &amp; Dua Interactive</span>
    </div>
    <span class="text-[11px] text-slate-400">Tap beads, Swipe, or press <kbd class="px-1.5 py-0.5 bg-slate-800/80 border border-slate-700 rounded text-slate-300">Space</kbd></span>
  </div>

  <!-- Phone Mockup Viewport Container -->
  <main id="phone-viewport" class="relative w-full h-full sm:w-[400px] sm:h-[830px] sm:max-h-[90dvh] sm:rounded-[46px] sm:border-[10px] sm:border-slate-900/95 sm:shadow-[0_25px_70px_-15px_rgba(0,0,0,0.85),0_0_0_1px_rgba(255,255,255,0.08)] overflow-hidden flex flex-col justify-between bg-[#07131e]">

    <!-- Phone Dynamic Island / Notch on Desktop -->
    <div class="hidden sm:flex absolute top-2 left-1/2 -translate-x-1/2 z-50 w-28 h-5 bg-black/90 rounded-full items-center justify-end px-2.5 pointer-events-none border border-white/5">
      <div class="w-2 h-2 rounded-full bg-emerald-500/40"></div>
    </div>

    <!-- Shared Twinkling Starfield Layer -->
    <div id="starfield" class="absolute inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- Top Navigation & Utility Bar -->
    <header class="relative z-40 pt-4 sm:pt-9 px-4 flex items-center justify-between gap-2">
      <!-- Scene Switcher Pill Toggle -->
      <div class="flex items-center bg-slate-950/55 backdrop-blur-md p-1 rounded-full border border-white/10 shadow-lg">
        <button id="tab-tasbih" onclick="switchScene('tasbih')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide transition-all duration-300 bg-gradient-to-r from-amber-500 to-amber-400 text-slate-950 shadow-md">
          Tasbih Counter
        </button>
        <button id="tab-story" onclick="switchScene('story')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide transition-all duration-300 text-slate-300 hover:text-white">
          Market Dua
        </button>
      </div>

      <!-- Sound & Haptic / Info Controls -->
      <div class="flex items-center gap-1.5">
        <button id="btn-sound" onclick="toggleSound()" title="Toggle Bead Sound" class="w-9 h-9 rounded-full bg-slate-950/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-slate-300 hover:text-white active:scale-95 transition">
          <!-- Speaker On Icon -->
          <svg id="icon-sound-on" class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
          </svg>
          <!-- Speaker Off Icon -->
          <svg id="icon-sound-off" class="w-4 h-4 text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ==========================================
         SCENE 1: INTERACTIVE 3D TASBIH COUNTER
         ========================================== -->
    <section id="scene-tasbih" class="relative z-10 flex-1 flex flex-col justify-between overflow-hidden transition-opacity duration-500">
      <!-- Atmospheric Background Gradient matching video -->
      <div class="absolute inset-0 -z-10 bg-gradient-to-b from-[#071420] via-[#0c2233] to-[#13324a] pointer-events-none"></div>

      <!-- Glowing Full Moon with Craters (Top Right, as seen in video) -->
      <div class="absolute top-5 right-9 pointer-events-none z-0">
        <div class="relative w-14 h-14 rounded-full bg-[#f4f7fa] shadow-[0_0_45px_12px_rgba(226,240,255,0.28)] flex items-center justify-center">
          <!-- Moon Craters -->
          <span class="absolute top-2.5 left-3 w-2.5 h-2.5 rounded-full bg-slate-300/65"></span>
          <span class="absolute top-3.5 right-3 w-2 h-2 rounded-full bg-slate-300/55"></span>
          <span class="absolute bottom-3 left-4 w-1.5 h-1.5 rounded-full bg-slate-300/60"></span>
          <span class="absolute bottom-3.5 right-3.5 w-3 h-2 rounded-full bg-slate-300/50 rotate-12"></span>
        </div>
      </div>

      <!-- Dhikr Selector Pills + Typography Area -->
      <div class="relative z-20 flex flex-col items-center px-5 pt-2 text-center">
        <!-- Adhkar Selector Chips -->
        <div id="dhikr-selector" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full py-1 px-2 mb-2">
          <!-- Populated dynamically via JS -->
        </div>

        <!-- Main Arabic Calligraphy -->
        <div class="min-h-[84px] flex flex-col items-center justify-center">
          <h1 id="dhikr-arabic" dir="rtl" class="arabic-text text-4xl sm:text-[48px] text-white font-normal tracking-wide transition-all duration-300 select-none">
            أَسْتَغْفِرُ اللّٰهَ
          </h1>
        </div>

        <!-- Transliteration & Meaning -->
        <h2 id="dhikr-translit" class="mt-1 text-lg sm:text-[20px] font-medium text-slate-100 tracking-wide transition-all duration-300">
          Astaghfirullah
        </h2>
        <p id="dhikr-meaning" class="mt-0.5 text-xs text-slate-300/70 font-normal max-w-[270px] leading-relaxed">
          I seek forgiveness from Allah
        </p>
      </div>

      <!-- Interactive First-Person POV 3D Bead Canvas Area -->
      <div id="bead-touch-zone" class="relative z-20 flex-1 flex flex-col items-center justify-center cursor-grab active:cursor-grabbing group select-none">
        <!-- POV Ergonomic Mode Pill Switcher (Top Left of Canvas Zone) -->
        <div class="absolute top-1 left-4 z-30 flex items-center gap-1.5">
          <button id="btn-pov-mode" onclick="togglePovMode(event)" class="px-2.5 py-1 rounded-full bg-slate-950/55 hover:bg-slate-900/80 backdrop-blur-md border border-white/10 text-[10px] font-medium text-amber-300/90 flex items-center gap-1.5 shadow transition active:scale-95">
            <svg class="w-3 h-3 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" />
            </svg>
            <span id="pov-mode-label">POV: Vertical Pull</span>
          </button>
        </div>

        <!-- Bead Material Theme Switcher (Top Right of Canvas Zone) -->
        <div class="absolute top-1 right-4 z-30 flex items-center gap-1.5">
          <button id="btn-bead-theme" onclick="cycleBeadTheme(event)" class="px-2.5 py-1 rounded-full bg-slate-950/55 hover:bg-slate-900/80 backdrop-blur-md border border-white/10 text-[10px] font-medium text-sky-200/90 flex items-center gap-1.5 shadow transition active:scale-95">
            <span id="bead-theme-dot" class="w-2 h-2 rounded-full bg-sky-400"></span>
            <span id="bead-theme-label">Aqeeq Blue</span>
          </button>
        </div>

        <!-- Floating +1 container -->
        <div id="plus-one-container" class="absolute inset-0 pointer-events-none z-30"></div>

        <!-- HTML5 Canvas for 3D Foreshortened First-Person Tasbih Loop -->
        <canvas id="tasbih-canvas" class="w-full h-[290px] sm:h-[310px] block touch-none"></canvas>

        <!-- Subtle pull/drag helper prompt -->
        <div id="tap-prompt" class="pointer-events-none -mt-3 flex items-center gap-1.5 text-[11px] text-amber-200/75 uppercase tracking-widest transition-opacity duration-500">
          <svg class="w-3.5 h-3.5 animate-bounce text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
          </svg>
          <span>Pull bead down toward you</span>
        </div>
      </div>

      <!-- Bottom Circular Progress Ring & Controls -->
      <div class="relative z-20 pb-5 pt-0.5 px-6 flex flex-col items-center">
        <!-- Main Counter Row: Reset Button | Circular Progress | Target Toggle -->
        <div class="w-full flex items-center justify-center gap-7">
          <!-- Reset Counter Button -->
          <button onclick="resetTasbih()" title="Reset Counter" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 active:scale-90 border border-white/10 flex items-center justify-center text-slate-300/80 hover:text-white transition">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>

          <!-- Circular Progress Ring -->
          <div onclick="incrementTasbih()" class="relative w-20 h-20 flex items-center justify-center cursor-pointer active:scale-95 transition-transform" title="Tap or Pull Bead to Count">
            <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
              <!-- Track circle -->
              <circle cx="50" cy="50" r="41" fill="rgba(7, 20, 32, 0.45)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />
              <!-- Animated Progress Arc -->
              <circle id="progress-ring-circle" cx="50" cy="50" r="41" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="257.61" stroke-dashoffset="257.61" class="transition-all duration-300 ease-out" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span id="tasbih-count-text" class="text-xl font-bold text-white leading-none tracking-tight">0</span>
              <span id="tasbih-target-text" class="text-[10px] text-slate-300/75 font-medium mt-1">/ 100</span>
            </div>
          </div>

          <!-- Target Cycle Button (33 / 100 / 1000) -->
          <button onclick="cycleTarget()" title="Change Target Goal" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 active:scale-90 border border-white/10 flex flex-col items-center justify-center text-slate-300/80 hover:text-white transition">
            <span class="text-[9px] uppercase tracking-tighter text-slate-400">Goal</span>
            <span id="btn-goal-label" class="text-[11px] font-bold text-amber-400 leading-tight">100</span>
          </button>
        </div>

        <!-- Subtle Watermark / Footer Credit -->
        <div class="mt-2.5 text-[11px] text-slate-300/40 tracking-wide font-medium">
          First-Person Tactile Tasbih • Drag or Flick Down
        </div>
      </div>
    </section>

    <!-- ==========================================
         SCENE 2: ILLUSTRATED HADITH & MARKETPLACE DUA STORY
         ========================================== -->
    <section id="scene-story" class="hidden relative z-10 flex-1 flex flex-col justify-between overflow-hidden">
      <!-- Night Sky Background -->
      <div class="absolute inset-0 -z-10 bg-gradient-to-b from-[#07111e] via-[#0b1b2d] to-[#112338] pointer-events-none"></div>

      <!-- Story Progress Bars (Instagram/App Story Style) -->
      <div class="relative z-30 px-4 pt-2 flex flex-col gap-2">
        <div id="story-progress-bars" class="grid grid-cols-7 gap-1.5 w-full">
          <!-- 7 segments generated by JS -->
        </div>

        <!-- Story Controls Row: Step counter + Auto-play toggle -->
        <div class="flex items-center justify-between text-[11px] text-slate-300/75 px-0.5 pt-0.5">
          <span id="story-step-badge" class="font-medium tracking-wide text-amber-300/90">Part 1 of 7</span>
          <div class="flex items-center gap-2">
            <button id="btn-autoplay" onclick="toggleStoryAutoplay()" class="px-2.5 py-0.5 rounded-full bg-white/10 hover:bg-white/15 border border-white/10 text-[11px] text-slate-200 flex items-center gap-1.5 transition">
              <span id="autoplay-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
              <span id="autoplay-label">Auto-Play: ON</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Story Typography Stage (Upper Half of Screen) -->
      <div id="story-text-stage" class="relative z-20 flex-1 flex flex-col items-center justify-center px-6 text-center pb-4 select-none">
        <!-- Populated dynamically with smooth step transitions -->
      </div>

      <!-- Left / Right Invisible Tap Zones for Story Navigation -->
      <div class="absolute inset-x-0 top-20 bottom-16 z-20 flex">
        <div onclick="prevStoryStep()" class="w-2/5 h-full cursor-pointer" title="Previous Step"></div>
        <div onclick="nextStoryStep()" class="w-3/5 h-full cursor-pointer" title="Next Step"></div>
      </div>

      <!-- Illustrated Night Marketplace Scene (Bottom Half of Screen, inside/transitioning from Arabian Archway) -->
      <div class="relative z-10 w-full h-[54%] flex flex-col justify-end pointer-events-none">

        <!-- Outer Frame / Archway Overlay (Visible in Step 1 like 00:04 of video, opens up in Steps 2-7) -->
        <div id="archway-border-overlay" class="absolute inset-0 z-30 transition-all duration-700 ease-out pointer-events-none">
          <svg viewBox="0 0 400 440" preserveAspectRatio="none" class="w-full h-full">
            <!-- Deep night mask outside the arch + warm gold/crimson arch border -->
            <path d="M0,0 L400,0 L400,440 L0,440 Z M42,440 L358,440 L358,185 C358,85 285,22 200,22 C115,22 42,85 42,185 Z" fill="#07111e" fill-rule="evenodd"/>
            <!-- Double ornamental Arabian Arch outline -->
            <path d="M42,440 L42,185 C42,85 115,22 200,22 C285,22 358,85 358,185 L358,440" fill="none" stroke="#8f2d2c" stroke-width="8" />
            <path d="M47,440 L47,185 C47,88 118,27 200,27 C282,27 353,88 353,185 L353,440" fill="none" stroke="#f0b254" stroke-width="2.5" />
          </svg>
        </div>

        <!-- Detailed Vector Marketplace Illustration -->
        <div id="market-scene-illustration" class="relative w-full h-full overflow-hidden transition-transform duration-700">
          <svg viewBox="0 0 400 420" preserveAspectRatio="xMidYMax slice" class="w-full h-full block">
            <defs>
              <!-- Warm Lantern Radial Glow -->
              <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffdf7a" stop-opacity="0.95" />
                <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.45" />
                <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
              </radialGradient>

              <!-- Distant City Silhouette Gradient -->
              <linearGradient id="cityBack" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2c3252" />
                <stop offset="100%" stop-color="#1a1c33" />
              </linearGradient>

              <!-- Midground Buildings Gradient -->
              <linearGradient id="cityMid" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4e2234" />
                <stop offset="100%" stop-color="#2d1320" />
              </linearGradient>

              <!-- Wooden Market Deck Gradient -->
              <linearGradient id="woodFloor" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#472425" />
                <stop offset="100%" stop-color="#251114" />
              </linearGradient>
            </defs>

            <!-- 1. Distant Night Skyline (Domes, Minarets, Arched Roofs) -->
            <g fill="url(#cityBack)">
              <rect x="0" y="95" width="60" height="120" rx="2" />
              <!-- Dome 1 -->
              <path d="M68,135 C68,85 135,85 135,135 Z" />
              <rect x="65" y="133" width="75" height="90" />
              <!-- Center Minaret / Tower -->
              <rect x="155" y="88" width="46" height="130" />
              <path d="M160,88 C160,65 196,65 196,88 Z" />
              <!-- Dome 2 -->
              <path d="M210,130 C210,72 288,72 288,130 Z" />
              <rect x="206" y="128" width="86" height="95" />
              <!-- Right Skyline -->
              <path d="M308,125 C308,82 368,82 368,125 Z" />
              <rect x="302" y="123" width="98" height="100" />
            </g>

            <!-- 2. Midground Warm Arabian Buildings & Glowing Windows -->
            <g fill="url(#cityMid)">
              <rect x="10" y="125" width="95" height="95" />
              <rect x="115" y="112" width="110" height="110" />
              <rect x="235" y="130" width="90" height="95" />
              <rect x="330" y="115" width="70" height="110" />
            </g>
            <!-- Warm Lit Windows in Midground Buildings -->
            <g fill="#f6c453" opacity="0.85">
              <rect x="28" y="140" width="7" height="12" rx="3.5" />
              <rect x="42" y="140" width="7" height="12" rx="3.5" />
              <rect x="75" y="146" width="10" height="6" rx="1" />
              <rect x="140" y="132" width="8" height="14" rx="4" />
              <rect x="154" y="132" width="8" height="14" rx="4" />
              <rect x="192" y="136" width="12" height="7" rx="1" />
              <rect x="262" y="142" width="14" height="7" rx="1" />
              <rect x="352" y="134" width="8" height="14" rx="4" />
              <rect x="366" y="134" width="8" height="14" rx="4" />
            </g>

            <!-- 3. Interior Market Backdrop & Hanging Bunting Flags -->
            <rect x="0" y="176" width="400" height="165" fill="#1b0e18" />

            <!-- Decorative String Lights & Pennant Bunting -->
            <path d="M0,195 Q100,225 200,195 Q300,225 400,195" fill="none" stroke="#6e473b" stroke-width="1.2" />
            <path d="M20,210 Q130,245 250,205 Q330,235 395,210" fill="none" stroke="#6e473b" stroke-width="1" />
            <!-- Tiny Glowing Fairy Bulbs -->
            <g fill="#fde68a">
              <circle cx="45" cy="204" r="2" />
              <circle cx="95" cy="210" r="2.2" />
              <circle cx="150" cy="206" r="1.8" />
              <circle cx="215" cy="200" r="2" />
              <circle cx="275" cy="212" r="2.2" />
              <circle cx="335" cy="207" r="2" />
            </g>

            <!-- 4. Swaying Golden Market Lanterns -->
            <g class="lantern-sway" style="--sway-dur: 4.5s; --sway-delay: -0.5s; transform-origin: 72px 175px;">
              <line x1="72" y1="175" x2="72" y2="205" stroke="#d97706" stroke-width="1.5" />
              <circle cx="72" cy="214" r="22" fill="url(#lanternGlow)" />
              <path d="M66,205 L78,205 L81,215 L72,226 L63,215 Z" fill="#fef08a" stroke="#b45309" stroke-width="1.2" />
            </g>

    // `visualCount` is the continuous bead offset rendered on the 3D loop.
    // When dragging down, `dragProgress` (0.0 -> 1.15) adds directly to `count` so the bead follows the finger 1:1!
    let visualCount = 0;

    /* =========================================================================
       3. WEB AUDIO SYNTHESIZER (Realistic Tactile Bead Clack & Tension Tick)
       ========================================================================= */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeadClick(isMilestone = false, isSoftTick = false) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (isSoftTick) {
          // Subtle friction tick when gripping or crossing tension threshold
          const tickOsc = audioCtx.createOscillator();
          const tickGain = audioCtx.createGain();
          tickOsc.type = 'sine';
          tickOsc.frequency.setValueAtTime(190, now);
          tickOsc.frequency.exponentialRampToValueAtTime(75, now + 0.022);
          tickGain.gain.setValueAtTime(0.08, now);
          tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
          tickOsc.connect(tickGain);
          tickGain.connect(audioCtx.destination);
          tickOsc.start(now);
          tickOsc.stop(now + 0.028);
          return;
        }

        // Authentic organic wooden/mineral bead clack (dual-oscillator body + transient knock)
        const bodyOsc = audioCtx.createOscillator();
        const bodyGain = audioCtx.createGain();
        bodyOsc.type = 'triangle';
        const baseFreq = isMilestone ? 540 : 335 + (count % 6) * 7;
        bodyOsc.frequency.setValueAtTime(baseFreq, now);
        bodyOsc.frequency.exponentialRampToValueAtTime(88, now + 0.055);

        bodyGain.gain.setValueAtTime(0.34, now);
        bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        bodyOsc.connect(bodyGain);
        bodyGain.connect(audioCtx.destination);
        bodyOsc.start(now);
        bodyOsc.stop(now + 0.065);

        // Crisp high transient click of two beads colliding
        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = 'sine';
        clickOsc.frequency.setValueAtTime(1180, now);
        clickOsc.frequency.exponentialRampToValueAtTime(260, now + 0.018);
        clickGain.gain.setValueAtTime(0.16, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);
        clickOsc.start(now);
        clickOsc.stop(now + 0.022);

        // If target or 33-divider reached, play a warm resonant harmonic chime
        if (isMilestone) {
          const chime = audioCtx.createOscillator();
          const chimeGain = audioCtx.createGain();
          chime.type = 'sine';
          chime.frequency.setValueAtTime(659.25, now + 0.04); // E5
          chime.frequency.exponentialRampToValueAtTime(880, now + 0.38); // A5

          chimeGain.gain.setValueAtTime(0.18, now + 0.04);
          chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

          chime.connect(chimeGain);
          chimeGain.connect(audioCtx.destination);

          chime.start(now + 0.04);
          chime.stop(now + 0.65);
        }
      } catch (e) {
        // Ignore audio errors on restricted devices
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
      document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
      if (soundEnabled) playBeadClick(false);
    }

      if (e) e.stopPropagation();
      povMode = povMode === 'vertical' ? 'angled' : 'vertical';
      document.getElementById('pov-mode-label').textContent =
        povMode === 'vertical' ? 'POV: Vertical Pull' : 'POV: Right-Hand Hold';
      playBeadClick(false, true);
    }

    function cycleBeadTheme(e) {
      if (e) e.stopPropagation();
      activeBeadThemeIndex = (activeBeadThemeIndex + 1) % BEAD_THEMES.length;
      const theme = BEAD_THEMES[activeBeadThemeIndex];
      document.getElementById('bead-theme-label').textContent = theme.name;
      const dot = document.getElementById('bead-theme-dot');
      dot.className = `w-2 h-2 rounded-full ${theme.dotClass}`;
      playBeadClick(false, true);
    }

    /* =========================================================================
       4. STARFIELD GENERATOR
       ========================================================================= */
    function createStarfield() {
      const container = document.getElementById('starfield');
      const starCount = 42;
      let html = '';
      for (let i = 0; i < starCount; i++) {
        const x = (Math.random() * 96 + 2).toFixed(1);
        const y = (Math.random() * 56 + 2).toFixed(1);
        const size = (Math.random() * 2 + 1).toFixed(1);
        const dur = (Math.random() * 3 + 2.2).toFixed(1);
        const delay = (Math.random() * 4).toFixed(1);
        html += `<span class="star absolute rounded-full bg-white" style="left:${x}%; top:${y}%; width:${size}px; height:${size}px; --duration:${dur}s; --delay:-${delay}s;"></span>`;
      }
      container.innerHTML = html;
    }

    /* =========================================================================
       5. SCENE 1: FIRST-PERSON POV 3D TASBIH LOOP & TACTILE ENGINE
       ========================================================================= */
    const canvas = document.getElementById('tasbih-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function renderDhikrSelector() {
      const container = document.getElementById('dhikr-selector');
      container.innerHTML = ADHKAR_LIST.map((item, idx) => {
        const active = idx === activeDhikrIndex;
        return `
          <button onclick="selectDhikr(${idx})" class="px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
            active
              ? 'bg-white/15 text-amber-300 border border-amber-400/40 shadow-sm'
              : 'bg-white/5 text-slate-400 hover:text-slate-200 border border-transparent'
          }">
            ${item.label}
          </button>
        `;
      }).join('');
    }

    function selectDhikr(index) {
      activeDhikrIndex = index;
      const item = ADHKAR_LIST[index];
      document.getElementById('dhikr-arabic').textContent = item.arabic;
      document.getElementById('dhikr-translit').textContent = item.translit;
      document.getElementById('dhikr-meaning').textContent = item.meaning;
      targetGoal = item.defaultTarget;
      count = 0;
      visualCount = 0;
      dragProgress = 0;
      updateTasbihUI();
      renderDhikrSelector();
    }

    function incrementTasbih(fromDrag = false) {
      count++;
      beadPulse = 1.0;
      pinchRipple = 1.0;

      // If triggered by a tap/key rather than continuous finger drag,
      // let visualCount smoothly spring forward from previous bead
      if (fromDrag) {
        dragProgress = Math.max(0, dragProgress - 1.0);
      }

      const isMilestone = count % targetGoal === 0 || count % 33 === 0;
      playBeadClick(isMilestone, false);

      if (navigator.vibrate) {
        navigator.vibrate(isMilestone ? [28, 45, 35] : 16);
      }

      spawnPlusOne();
      updateTasbihUI();
    }

    function resetTasbih() {
      count = 0;
      dragProgress = 0;
      beadPulse = 0.6;
      pinchRipple = 0.7;
      playBeadClick(false);
      updateTasbihUI();
    }

    function cycleTarget() {
      const goals = [33, 100, 1000];
      const nextIdx = (goals.indexOf(targetGoal) + 1) % goals.length;
      targetGoal = goals[nextIdx];
      updateTasbihUI();
    }

    function updateTasbihUI() {
      document.getElementById('tasbih-count-text').textContent = count;
      document.getElementById('tasbih-target-text').textContent = `/ ${targetGoal}`;
      document.getElementById('btn-goal-label').textContent = targetGoal;

      // Update SVG circular progress ring
      const circumference = 257.61; // 2 * PI * 41
      const progressFraction = Math.min(1, (count % targetGoal === 0 && count > 0) ? 1 : (count % targetGoal) / targetGoal);
      const offset = circumference - progressFraction * circumference;
      document.getElementById('progress-ring-circle').style.strokeDashoffset = offset;

      // Hide helper prompt after first count
      const prompt = document.getElementById('tap-prompt');
      if (prompt) {
        prompt.style.opacity = count > 0 ? '0' : '1';
      }
    }

    function spawnPlusOne() {
      const container = document.getElementById('plus-one-container');
      const rect = container.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'float-plus absolute text-sm font-bold text-amber-300 drop-shadow-[0_2px_8px_rgba(251,191,36,0.5)] pointer-events-none select-none';
      const x = rect.width * 0.56 + (Math.random() * 12 - 6);
      const y = rect.height * 0.62;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.textContent = '+1';
      container.appendChild(el);
      setTimeout(() => el.remove(), 750);
    }

    /**
     * Evaluates a 3D First-Person Perspective (POV) point along the Tasbih loop.
     *
     * Concept:
     * - You are holding the Tasbih in front of you in first-person view.
     * - `u = 0` is the FOREGROUND PINCH POINT (resting right between your thumb & index finger).
     * - `u > 0` (e.g., +1, +2 ... +8) are the UPCOMING beads stretching away into the upper background loop,
     *   getting smaller with 3D perspective foreshortening before curving around the top loop.
     * - `u < 0` (e.g., -1, -2) are the JUST-PULLED beads dropping down toward you / under your thumb
     *   and looping back around the underside of the strand into the background.
     */
    function getFirstPersonBeadPoint(u, width, height) {
      const isAngled = povMode === 'angled';
      const pinchX = isAngled ? width * 0.46 : width * 0.50;
      const pinchY = height * 0.68;

      // Normalize u into a closed 16-bead visual loop (-5 to +11)
      // Positive u (0 -> 9): foreground pinch point up into the distant top arch
      // Negative u (0 -> -3.5): pulled down past the thumb toward the bottom edge
      let x = pinchX;
      let y = pinchY;
      let scale = 1.0;
      let depthAlpha = 1.0;
      let zOrder = 100 - Math.abs(u) * 10;
      let angle = 0;

      if (u >= -1.6 && u <= 8.5) {
        // Main active front strand (from top-back loop coming forward down to the thumb pinch point)
        if (u >= 0) {
          // Upcoming beads receding into 3D depth (u = 0 is closest, u = 8.5 is top of loop)
          const t = u / 8.5; // 0 (foreground) -> 1 (far top loop)
          // Foreshortened vertical spacing: big steps near foreground, tighter steps in distance
          const foreshortenedT = 1 - Math.pow(1 - t, 1.55);
          const loopTopY = height * 0.10;
          y = pinchY - foreshortenedT * (pinchY - loopTopY);

          // Subtle natural 3D loop width (opens into an oval loop in the distance)
          const archSpread = Math.sin(t * Math.PI) * (isAngled ? 38 : 26);
          const angleTilt = isAngled ? t * 44 : 0;
          x = pinchX + archSpread + angleTilt;

          // Perspective scale: largest at u=0 (1.08x), smaller in distance (0.46x)
          scale = 1.08 - 0.62 * Math.pow(t, 0.85);
          depthAlpha = 1.0 - 0.55 * Math.pow(t, 1.2);
          zOrder = 200 - u * 15;
          angle = isAngled ? -0.18 : 0;
        } else {
          // Pulled bead (u < 0): moving DOWN toward the user's chest/palm over the thumb!
          const pullT = Math.min(1, Math.abs(u) / 1.6); // 0 -> 1 as bead is pulled down
          y = pinchY + pullT * (height * 0.27);
          x = pinchX - (isAngled ? pullT * 20 : 0);

          // Grows slightly as it comes even closer to the camera, then tucks under the thumb
          scale = 1.08 + Math.sin(pullT * Math.PI) * 0.10 - pullT * 0.15;
          depthAlpha = 1.0 - Math.pow(pullT, 1.8) * 0.78;
          zOrder = 220 + pullT * 20; // Renders right in front of the thumb!
          angle = isAngled ? -0.22 : 0;
        }
      } else {
        // Return strand in the background (completing the 3D hanging loop behind the main strand)
        // Map u in [8.5 .. 13.5] to the left/back return side of the loop
        const backT = Math.min(1, Math.max(0, (u - 8.5) / 5.5));
        const loopTopY = height * 0.10;
        y = loopTopY + Math.pow(backT, 1.2) * (pinchY - loopTopY + 35);
        const leftArc = Math.sin(backT * Math.PI) * (isAngled ? -46 : -38);
        x = pinchX + leftArc + (isAngled ? (1 - backT) * 40 - 14 : -12);

        scale = 0.44 + backT * 0.22;
        depthAlpha = (0.42 - backT * 0.25);
        zOrder = 20 - backT * 10;
        angle = 0.15;
      }

      return { x, y, scale, depthAlpha, zOrder, angle };
    }

    /**
     * Draws the tactile "Thumb & Index Pinch Zone" and pull-track guide in First-Person POV
     */
    function drawErgonomicPinchZone(ctx, width, height) {
      const isAngled = povMode === 'angled';
      const pinchX = isAngled ? width * 0.46 : width * 0.50;
      const pinchY = height * 0.68;

      ctx.save();
      if (isAngled) {
        ctx.translate(pinchX, pinchY);
        ctx.rotate(-0.16);
        ctx.translate(-pinchX, -pinchY);
      }

      // 1. Vertical Tactile Pull Track (shows where to drag the active bead down)
      const trackGrad = ctx.createLinearGradient(pinchX, pinchY - 30, pinchX, pinchY + 78);
      trackGrad.addColorStop(0, 'rgba(251, 191, 36, 0)');
      trackGrad.addColorStop(0.35, 'rgba(251, 191, 36, 0.16)');
      trackGrad.addColorStop(0.8, 'rgba(251, 191, 36, 0.28)');
      trackGrad.addColorStop(1, 'rgba(251, 191, 36, 0)');

      ctx.fillStyle = trackGrad;
      ctx.beginPath();
      ctx.roundRect(pinchX - 24, pinchY - 18, 48, 92, 24);
      ctx.fill();

      // Dashed center pull guide line
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.30)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(pinchX, pinchY + 18);
      ctx.lineTo(pinchX, pinchY + 62);
      ctx.stroke();
      ctx.setLineDash([]);

      // Downward chevron arrows inside the pull track
      const pullOffset = isDraggingBead ? dragProgress * 12 : Math.sin(performance.now() * 0.004) * 3;
      ctx.strokeStyle = isDraggingBead ? 'rgba(251, 191, 36, 0.85)' : 'rgba(251, 191, 36, 0.45)';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(pinchX - 6, pinchY + 46 + pullOffset);
      ctx.lineTo(pinchX, pinchY + 52 + pullOffset);
      ctx.lineTo(pinchX + 6, pinchY + 46 + pullOffset);
      ctx.stroke();

      // 2. Ripple Ring when a bead clicks past the thumb
      if (pinchRipple > 0.02) {
        const rippleR = 28 + (1 - pinchRipple) * 28;
        ctx.strokeStyle = `rgba(251, 191, 36, ${pinchRipple * 0.65})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(pinchX, pinchY, rippleR, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 3. Subtle Ergonomic Thumb Cradle Arc right below the active bead
      // Gives the unmistakable visual sensation of your thumb holding the bead in 1st person
      const thumbY = pinchY + 22 + (isDraggingBead ? Math.min(14, dragProgress * 14) : 0);
      ctx.strokeStyle = isDraggingBead ? 'rgba(251, 191, 36, 0.7)' : 'rgba(226, 232, 240, 0.25)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(pinchX, thumbY - 12, 28, 0.22 * Math.PI, 0.78 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    /**
     * Draws an individual 3D Bead, 33-Bead Divider Disc, or the Ornate Golden Imame (Minaret Head Bead)
     * with perspective scaling and depth-of-field shading.
     */
    function drawFirstPersonBead(ctx, pt, baseRadius, role, isActivePinch, pulse = 0) {
      const { x, y, scale, depthAlpha, angle } = pt;
      if (depthAlpha <= 0.03) return;

      ctx.save();
      ctx.globalAlpha = Math.min(1, Math.max(0, depthAlpha));

      const theme = BEAD_THEMES[activeBeadThemeIndex];

      // ROLE 1: Ornate Golden Imame (Minaret Head Marker at bead 0 / 100)
      if (role === 'imame') {
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(scale, scale);

        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 7;

        // Ornate Elongated Minaret Body + Tassel Crown
        const imameGrad = ctx.createLinearGradient(-14, -22, 14, 22);
        imameGrad.addColorStop(0, '#fef08a');
        imameGrad.addColorStop(0.35, '#f59e0b');
        imameGrad.addColorStop(0.7, '#b45309');
        imameGrad.addColorStop(1, '#78350f');

        // Conical minaret shaft
        ctx.fillStyle = imameGrad;
        ctx.beginPath();
        ctx.moveTo(-6, -24);
        ctx.lineTo(6, -24);
        ctx.lineTo(13, 14);
        ctx.quadraticCurveTo(0, 20, -13, 14);
        ctx.closePath();
        ctx.fill();

        // Decorative rings on the Imame
        ctx.strokeStyle = '#fef9c3';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-8, -8);
        ctx.lineTo(8, -8);
        ctx.moveTo(-11, 4);
        ctx.lineTo(11, 4);
        ctx.stroke();

        // Crown sphere on top of Imame
        ctx.beginPath();
        ctx.arc(0, -27, 6.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        return;
      }

      // ROLE 2: 33-Bead Sculpted Gold Divider Disc (at every 33rd bead)
      if (role === 'divider') {
        const r = baseRadius * scale * 0.92;
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;

        const divGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r * 1.2);
        divGrad.addColorStop(0, '#fffbeb');
        divGrad.addColorStop(0.35, '#fbbf24');
        divGrad.addColorStop(0.75, '#b45309');
        divGrad.addColorStop(1, '#451a03');

        ctx.fillStyle = divGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.18, r * 0.68, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(254, 243, 199, 0.6)';
        ctx.lineWidth = 1.2 * scale;
        ctx.stroke();

        ctx.restore();
        return;
      }

      // ROLE 3: Standard Spherical Bead or Active Foreground Pinch Bead
      const activeBoost = isActivePinch ? (1.14 + pulse * 0.08 + (isDraggingBead ? 0.05 : 0)) : 1.0;
      const r = baseRadius * scale * activeBoost;

      // Warm radial halo under the active foreground bead being pinched
      if (isActivePinch) {
        const glow = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 2.35);
        glow.addColorStop(0, 'rgba(251, 191, 36, 0.52)');
        glow.addColorStop(0.5, 'rgba(251, 191, 36, 0.16)');
        glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, r * 2.35, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3D Drop Shadow
      ctx.shadowColor = 'rgba(2, 8, 16, 0.72)';
      ctx.shadowBlur = 12 * scale;
      ctx.shadowOffsetY = 6 * scale;

      // 3D Spherical Lighting
      const grad = ctx.createRadialGradient(
        x - r * 0.34,
        y - r * 0.36,
        r * 0.08,
        x,
        y,
        r
      );

      if (isActivePinch) {
        // Active bead under the thumb glows warm amber-gold so user always feels the pinch target
        grad.addColorStop(0, '#fffbeb');
        grad.addColorStop(0.26, '#fcd34d');
        grad.addColorStop(0.68, '#d97706');
        grad.addColorStop(1, '#78350f');
      } else {
        grad.addColorStop(0, theme.light);
        grad.addColorStop(0.28, theme.mid);
        grad.addColorStop(0.70, theme.dark);
        grad.addColorStop(1, theme.deep);
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Bead drill-hole subtle rim on top & bottom for authentic 3D realism
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = 'rgba(15, 23, 42, 0.38)';
      ctx.beginPath();
      ctx.ellipse(x, y - r * 0.86, r * 0.16, r * 0.07, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dual Specular Highlights (Polished gemstone / wood sheen)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.32, y - r * 0.34, r * 0.22, r * 0.14, -0.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function renderTasbihCanvas() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      if (width === 0 || height === 0) return;

      ctx.clearRect(0, 0, width, height);

      // Target visual position includes live 1:1 finger drag tension!
      const targetVisual = count + dragProgress;
      const diff = targetVisual - visualCount;
      // Snappy tracking while dragging, smooth spring when released
      visualCount += diff * (isDraggingBead ? 0.48 : 0.20);
      if (Math.abs(diff) < 0.0005) visualCount = targetVisual;

      beadPulse *= 0.88;
      pinchRipple *= 0.90;

      // 1. Draw the 3D First-Person Tasbih Cord (Back loop + Front main strand)
      ctx.save();
      ctx.beginPath();
      const cordSteps = 75;
      for (let s = 0; s <= cordSteps; s++) {
        const u = -1.5 + (15.0 * s) / cordSteps;
        const pt = getFirstPersonBeadPoint(u, width, height);
        if (s === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.strokeStyle = 'rgba(186, 230, 253, 0.34)';
      ctx.lineWidth = 2.6;
      ctx.stroke();
      ctx.restore();

      // 2. Draw the Tactile Thumb Pinch Zone & Pull Guide under the foreground bead
      drawErgonomicPinchZone(ctx, width, height);

      // 3. Collect and Depth-Sort All Visible Beads Along the 3D Loop
      // Bead `i` has relative position `u = i - visualCount`.
      // When you pull down (`visualCount` increases), `u` decreases, moving beads DOWN toward you!
      const minIndex = Math.floor(visualCount) - 1;
      const maxIndex = Math.ceil(visualCount) + 13;

      const drawList = [];
      for (let i = minIndex; i <= maxIndex; i++) {
        const u = i - visualCount;
        if (u < -1.55 || u > 13.5) continue;

        const pt = getFirstPersonBeadPoint(u, width, height);

        // Determine if this bead is the Imame (at index -1 or every 100th) or a 33-bead divider
        let role = 'bead';
        if (i === -1 || (i > 0 && i % targetGoal === 0)) {
          role = 'imame';
        } else if (i > 0 && i % 33 === 0) {
          role = 'divider';
        }

        const isActivePinch = i === count;
        drawList.push({ i, u, pt, role, isActivePinch });
      }

      // Painter's Algorithm: Sort by `zOrder` so background return-loop beads draw first,
      // receding top beads draw next, and the foreground pinched bead draws dead last on top!
      drawList.sort((a, b) => a.pt.zOrder - b.pt.zOrder);

      for (const item of drawList) {
        drawFirstPersonBead(
          ctx,
          item.pt,
          21.5, // Base foreground radius in pixels
          item.role,
          item.isActivePinch,
          item.isActivePinch ? beadPulse : 0
        );
      }
    }

    /* =========================================================================
       6. FIRST-PERSON 1:1 DRAG, FLICK, WHEEL & KEYBOARD PHYSICS
       ========================================================================= */
    function setupTasbihInteractions() {
      const zone = document.getElementById('bead-touch-zone');
      let startX = 0;
      let startY = 0;
      let lastY = 0;
      let lastTime = 0;
      let velocityY = 0;
      let pointerId = null;
      let crossedHalfwayTick = false;

      // Pull distance in pixels required to pull one full bead over the thumb
      const PULL_THRESHOLD_PX = 52;

      zone.addEventListener('pointerdown', (e) => {
        // Ignore clicks on the top pill buttons inside the zone
        if (e.target.closest('button')) return;

        pointerId = e.pointerId;
        zone.setPointerCapture(pointerId);

        isDraggingBead = true;
        startX = e.clientX;
        startY = e.clientY;
        lastY = e.clientY;
        lastTime = performance.now();
        velocityY = 0;
        crossedHalfwayTick = false;
      });

      zone.addEventListener('pointermove', (e) => {
        if (!isDraggingBead || e.pointerId !== pointerId) return;

        const now = performance.now();
        const dt = Math.max(1, now - lastTime);
        const dy = e.clientY - startY;
        const dx = e.clientX - startX;

        velocityY = (e.clientY - lastY) / dt; // px per ms
        lastY = e.clientY;
        lastTime = now;

        // Support pulling DOWNWARD (primary 1st-person thumb motion) or swiping left/down-left
        const effectivePullPx = Math.max(0, dy + (povMode === 'angled' ? -dx * 0.35 : -dx * 0.15));
        dragProgress = effectivePullPx / PULL_THRESHOLD_PX;

        // Subtle tactile friction tick when user pulls bead halfway across thumb
        if (dragProgress > 0.45 && !crossedHalfwayTick) {
          crossedHalfwayTick = true;
          playBeadClick(false, true);
          if (navigator.vibrate) navigator.vibrate(6);
        }

        // Continuous multi-bead dragging: if user keeps pulling down past 1 full bead unit,
        // snap-count immediately and reset startY for seamless consecutive pulling!
        if (dragProgress >= 1.0) {
          incrementTasbih(true);
          startY = e.clientY;
          startX = e.clientX;
          dragProgress = 0;
          crossedHalfwayTick = false;
        }
      });

      function endPointerDrag(e) {
        if (!isDraggingBead || (e && e.pointerId !== pointerId)) return;
        isDraggingBead = false;

        const totalMove = Math.hypot(e.clientX - startX, e.clientY - startY);

        // Case 1: Quick downward flick (high downward velocity) or pulled past 50% threshold
        if (dragProgress >= 0.48 || (velocityY > 0.45 && dragProgress > 0.12)) {
          visualCount = count + dragProgress;
          dragProgress = 0;
          incrementTasbih(false);
        }
        // Case 2: Simple gentle tap on the active bead / zone
        else if (totalMove < 10) {
          dragProgress = 0;
          incrementTasbih(false);
        }
        // Case 3: Released early before threshold -> bead springs back to thumb rest
        else {
          dragProgress = 0;
        }

        pointerId = null;
      }

      zone.addEventListener('pointerup', endPointerDrag);
      zone.addEventListener('pointercancel', endPointerDrag);

      // Mouse Wheel support: scrolling down pulls beads toward you
      zone.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY > 12) {
          incrementTasbih(false);
        }
      }, { passive: false });

      // Keyboard navigation (ArrowDown / Space / Enter pulls bead toward you)
      window.addEventListener('keydown', (e) => {
        if (currentScene === 'tasbih') {
          if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'ArrowLeft') {
            e.preventDefault();
            incrementTasbih(false);
          }
        } else if (currentScene === 'story') {
          if (e.code === 'ArrowRight' || e.code === 'Space') {
            e.preventDefault();
            nextStoryStep();
          } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            prevStoryStep();
          }
        }
      });
    }

    /* =========================================================================
       7. SCENE 2: MARKETPLACE HADITH & DUA STORY ENGINE
       ========================================================================= */
    function initStoryProgressBars() {
      const container = document.getElementById('story-progress-bars');
      container.innerHTML = STORY_STEPS.map((_, idx) => `
        <div class="h-1 rounded-full bg-white/15 overflow-hidden">
          <div id="story-bar-${idx}" class="h-full bg-amber-400 transition-none" style="width: 0%"></div>
        </div>
      `).join('');
    }

    function renderStoryStep(index) {
      currentStoryStep = (index + STORY_STEPS.length) % STORY_STEPS.length;
      storyStepElapsed = 0;

      const step = STORY_STEPS[currentStoryStep];
      const stage = document.getElementById('story-text-stage');
      const badge = document.getElementById('story-step-badge');
      const archOverlay = document.getElementById('archway-border-overlay');
      const marketIllustration = document.getElementById('market-scene-illustration');

      badge.textContent = `Part ${currentStoryStep + 1} of ${STORY_STEPS.length}`;

      // Toggle Arabian Archway framing (Step 1 has the ornate arch frame just like 00:04 of the video,
      // then seamlessly zooms/opens into the full marketplace panorama for Steps 2-7)
      if (step.archFramed) {
        archOverlay.style.opacity = '1';
        archOverlay.style.transform = 'scale(1)';
        marketIllustration.style.transform = 'scale(0.92) translateY(8px)';
      } else {
        archOverlay.style.opacity = '0';
        archOverlay.style.transform = 'scale(1.18)';
        marketIllustration.style.transform = 'scale(1) translateY(0px)';
      }

      // Render Typography for Current Step
      if (step.type === 'dua') {
        stage.innerHTML = `
          <div key="${currentStoryStep}" class="story-step-anim flex flex-col items-center px-2 max-w-[340px]">
            <p dir="rtl" class="arabic-text text-3xl sm:text-4xl text-white font-normal mb-3 leading-relaxed">
              ${step.arabic}
            </p>
            <p class="text-xs sm:text-sm text-amber-300/90 font-medium tracking-wide mb-2">
              ${step.translit}
            </p>
            <p class="text-sm sm:text-base text-slate-200/90 font-normal leading-relaxed">
              ${step.meaning}
            </p>
          </div>
        `;
      } else {
        stage.innerHTML = `
          <div key="${currentStoryStep}" class="story-step-anim flex flex-col items-center px-2">
            ${step.html}
          </div>
        `;
      }

      updateStoryBarsUI(0);
    }

    function updateStoryBarsUI(currentFraction) {
      for (let i = 0; i < STORY_STEPS.length; i++) {
        const bar = document.getElementById(`story-bar-${i}`);
        if (!bar) continue;
        if (i < currentStoryStep) {
          bar.style.width = '100%';
        } else if (i > currentStoryStep) {
          bar.style.width = '0%';
        } else {
          bar.style.width = `${Math.min(100, Math.max(0, currentFraction * 100))}%`;
        }
      }
    }

    function nextStoryStep() {
      playBeadClick(false);
      renderStoryStep(currentStoryStep + 1);
    }

    function prevStoryStep() {
      playBeadClick(false);
      renderStoryStep(currentStoryStep - 1);
    }

    function toggleStoryAutoplay() {
      storyAutoplay = !storyAutoplay;
      document.getElementById('autoplay-label').textContent = `Auto-Play: ${storyAutoplay ? 'ON' : 'OFF'}`;
      const dot = document.getElementById('autoplay-dot');
      if (storyAutoplay) {
        dot.classList.add('bg-emerald-400', 'animate-ping');
        dot.classList.remove('bg-slate-400');
      } else {
        dot.classList.remove('bg-emerald-400', 'animate-ping');
        dot.classList.add('bg-slate-400');
      }
    }

    /* =========================================================================
       8. SCENE SWITCHING & MAIN 60FPS ANIMATION LOOP
       ========================================================================= */
    function switchScene(scene) {
      currentScene = scene;
      const tasbihSec = document.getElementById('scene-tasbih');
      const storySec = document.getElementById('scene-story');
      const tabTasbih = document.getElementById('tab-tasbih');
      const tabStory = document.getElementById('tab-story');

      const activeClasses = ['bg-gradient-to-r', 'from-amber-500', 'to-amber-400', 'text-slate-950', 'shadow-md'];
      const inactiveClasses = ['text-slate-300', 'hover:text-white'];

      if (scene === 'tasbih') {
        tasbihSec.classList.remove('hidden');
        storySec.classList.add('hidden');
        tabTasbih.classList.add(...activeClasses);
        tabTasbih.classList.remove(...inactiveClasses);
        tabStory.classList.remove(...activeClasses);
        tabStory.classList.add(...inactiveClasses);
        resizeCanvas();
      } else {
        tasbihSec.classList.add('hidden');
        storySec.classList.remove('hidden');
        tabStory.classList.add(...activeClasses);
        tabStory.classList.remove(...inactiveClasses);
        tabTasbih.classList.remove(...activeClasses);
        tabTasbih.classList.add(...inactiveClasses);
        renderStoryStep(currentStoryStep);
      }

      playBeadClick(false);
    }

    function mainLoop(now) {
      const dt = now - storyTimerLast;
      storyTimerLast = now;

      if (currentScene === 'tasbih') {
        renderTasbihCanvas();
      } else if (currentScene === 'story') {
        const step = STORY_STEPS[currentStoryStep];
        if (storyAutoplay && step) {
          storyStepElapsed += dt;
          const fraction = storyStepElapsed / step.duration;
          updateStoryBarsUI(fraction);
          if (storyStepElapsed >= step.duration) {
            renderStoryStep(currentStoryStep + 1);
          }
        }
      }

      requestAnimationFrame(mainLoop);
    }

    /* =========================================================================
       9. INITIALIZATION ON WINDOW LOAD
       ========================================================================= */
    window.onload = function () {
      createStarfield();
      renderDhikrSelector();
      updateTasbihUI();
      resizeCanvas();
      setupTasbihInteractions();
      initStoryProgressBars();
      renderStoryStep(0);

      window.addEventListener('resize', resizeCanvas);
      storyTimerLast = performance.now();
      requestAnimationFrame(mainLoop);
    };
  </script>
</body>
</html>
